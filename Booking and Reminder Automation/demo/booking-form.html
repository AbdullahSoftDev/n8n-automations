<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Automation Demo</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; }
    .card {
      width: min(680px, 100%);
      margin: auto;
      background: white;
      border: 1px solid #e6eaf0;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 14px 40px rgba(20, 30, 50, .08);
    }
    h1 { margin: 0 0 8px; }
    p { color: #657084; }
    form { display: grid; gap: 14px; margin-top: 24px; }
    label { font-weight: 600; font-size: 14px; }
    input, textarea, select, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d9deea;
      border-radius: 10px;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button { cursor: pointer; font-weight: 700; background: #111827; color: white; }
    button:disabled { opacity: .6; cursor: wait; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .status { display: none; padding: 14px; border-radius: 10px; margin-top: 16px; white-space: pre-wrap; }
    .success { background: #ecfdf3; color: #166534; display: block; }
    .error { background: #fef2f2; color: #991b1b; display: block; }
    .honeypot { position: absolute; left: -9999px; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Book an Appointment</h1>
    <p>This demo submits directly to the n8n <code>/new-booking</code> webhook.</p>

    <form id="bookingForm">
      <div class="grid">
        <div>
          <label for="name">Name *</label>
          <input id="name" name="name" required>
        </div>
        <div>
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required>
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone">
        </div>
        <div>
          <label for="service">Service</label>
          <input id="service" name="service" value="Consultation">
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="date">Date *</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div>
          <label for="time">Time *</label>
          <input id="time" name="time" type="time" required>
        </div>
      </div>

      <div>
        <label for="duration">Duration (minutes)</label>
        <input id="duration" name="duration" type="number" min="15" max="480" value="60">
      </div>

      <div>
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Anything the business should know?"></textarea>
      </div>

      <!-- Honeypot field: keep hidden from normal users -->
      <div class="honeypot" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button id="submitButton" type="submit">Confirm Booking</button>
    </form>

    <div id="status" class="status"></div>
  </main>

  <script>
    // Change this for your n8n deployment.
    const WEBHOOK_URL = "http://localhost:5678/webhook/new-booking";

    const form = document.getElementById("bookingForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.className = "status";
      status.textContent = "";
      button.disabled = true;

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());
      payload.duration = Number(payload.duration || 60);

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error((result.errors || ["Booking failed."]).join("\n"));
        }

        status.className = "status success";
        status.textContent =
          `Booking confirmed!\nBooking ID: ${result.bookingId}\nWhen: ${result.when}`;

        form.reset();
        document.getElementById("duration").value = 60;
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message || "Unable to submit booking.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
